name: Deploy Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: zalo-oa-chatbot-production
  cancel-in-progress: false

jobs:
  build:
    name: Build production image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/dncmaduro/zalo-oa-chatbot:${{ github.sha }}
            ghcr.io/dncmaduro/zalo-oa-chatbot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build

    runs-on:
      - self-hosted
      - linux
      - x64
      - zalo-prod

    permissions:
      contents: read
      packages: read

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select immutable image
        run: |
          echo "BACKEND_IMAGE=ghcr.io/dncmaduro/zalo-oa-chatbot:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Pull backend image
        run: |
          docker compose \
            --env-file /opt/zalo-oa-chatbot/prod.env \
            -f docker-compose.prod.yml \
            pull backend

      - name: Start PostgreSQL
        run: |
          docker compose \
            --env-file /opt/zalo-oa-chatbot/prod.env \
            -f docker-compose.prod.yml \
            up -d postgres

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker compose \
              --env-file /opt/zalo-oa-chatbot/prod.env \
              -f docker-compose.prod.yml \
              exec -T postgres \
              sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            then
              echo "PostgreSQL is ready"
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL failed to become ready"
          exit 1

      - name: Run Prisma migrations
        run: |
          docker compose \
            --env-file /opt/zalo-oa-chatbot/prod.env \
            -f docker-compose.prod.yml \
            run --rm backend \
            yarn prisma migrate deploy

      - name: Deploy backend
        run: |
          docker compose \
            --env-file /opt/zalo-oa-chatbot/prod.env \
            -f docker-compose.prod.yml \
            up -d --remove-orphans backend

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl \
              --connect-timeout 2 \
              -sS \
              -o /dev/null \
              http://127.0.0.1:3000/
            then
              echo "Backend is reachable"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend failed to start"

          docker compose \
            --env-file /opt/zalo-oa-chatbot/prod.env \
            -f docker-compose.prod.yml \
            logs --tail=150 backend

          exit 1

      - name: Show deployment status
        run: |
          docker compose \
            --env-file /opt/zalo-oa-chatbot/prod.env \
            -f docker-compose.prod.yml \
            ps
